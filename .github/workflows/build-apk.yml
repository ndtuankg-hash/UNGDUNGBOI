name: Build B Dich APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cai Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tao APK cai truc tiep
        run: ./gradlew --no-daemon assembleDebug

      - name: Doi ten APK
        run: cp app/build/outputs/apk/debug/app-debug.apk B-Dich-Android-v0.1.3.apk

      - name: Luu file APK
        uses: actions/upload-artifact@v4
        with:
          name: B-Dich-Android-v0.1.3
          path: B-Dich-Android-v0.1.3.apk
          if-no-files-found: error
