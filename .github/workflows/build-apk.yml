name: Build B Dich APK
# Phat hanh BOI Dich 0.1.9

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cai Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Khoi phuc khoa ky co dinh
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Kiem tra bien dich tren pull request
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-daemon assembleDebug

      - name: Tao APK cai truc tiep
        if: github.event_name != 'pull_request'
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Doi ten APK
        if: github.event_name != 'pull_request'
        id: package
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "B-Dich-Android-v${VERSION_NAME}.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Luu file APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: B-Dich-Android-v${{ steps.package.outputs.version_name }}
          path: B-Dich-Android-v${{ steps.package.outputs.version_name }}.apk
          if-no-files-found: error

      - name: Tao GitHub Release khi xuat ban
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.package.outputs.version_name }}
        run: |
          TAG="v${VERSION_NAME}"
          APK="B-Dich-Android-v${VERSION_NAME}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "BOI Dịch ${VERSION_NAME}" --notes "Bản cập nhật BOI Dịch ${VERSION_NAME}."
          fi
